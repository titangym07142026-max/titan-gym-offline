<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Titan Gym Offline</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;text-align:center;padding:18px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;margin:4px 2px}
.blue{background:#2563eb;color:#fff}.green{background:#15803d;color:#fff}
.gray{background:#e5e7eb}.primary{background:#111827;color:#fff}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px;font-size:16px}
label{font-weight:700;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none}.muted{color:#6b7280;font-size:13px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}
.qrbox{text-align:center}.qrbox img{max-width:280px}
.logrow{border-top:1px solid #eee;padding:12px 0}
.statusbox{padding:10px;border-radius:10px;background:#f8fafc;margin-top:8px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<header><h1>🏋️ TITAN GYM</h1><div>Offline Registration System</div></header>
<main>

<div class="card">
<h2>📷 Scan Entrance QR</h2>
<p class="muted">Scan the permanent Entrance QR.</p>
<button id="scanBtn" class="blue">SCAN ENTRANCE QR</button>
<button id="stopBtn" class="gray">STOP</button>
<div id="reader"></div>
<p id="scanMsg" class="muted"></p>
</div>

<div class="card">
<button id="simulateBtn" class="primary">🧪 SIMULATE ENTRANCE SCAN</button>
<button id="syncBtn" class="gray">SYNC PENDING NOW</button>
<div id="syncMsg" class="statusbox muted"></div>
</div>

<div class="card">
<h2>📝 Registration Form</h2>
<span id="verified" class="badge hidden">ENTRANCE QR VERIFIED</span>
<label for="name">Full Name</label>
<input id="name" placeholder="Enter full name">

<label for="customer">Student / Regular</label>
<select id="customer"><option>Student</option><option>Regular</option></select>

<label for="access">Access Type</label>
<select id="access"><option>Daily Walk-in</option><option>Monthly</option><option>Personal Trainer</option></select>

<div class="grid">
<div><label for="amount">Amount Paid</label><input id="amount" type="number" min="0" placeholder="0"></div>
<div><label for="payment">Payment</label><select id="payment"><option>Cash</option><option>GCash</option><option>Bank Transfer</option></select></div>
</div>

<label for="staff">Staff</label>
<input id="staff" placeholder="Staff name">

<button id="saveBtn" class="green">SAVE REGISTRATION</button>
</div>

<div id="customerCard" class="card hidden">
<h2>🔳 Customer QR</h2>
<div id="summary"></div>
<div id="customerQR" class="qrbox"></div>
</div>

<div class="card">
<h2>📋 Access Log</h2>
<span id="count" class="badge">0 records</span>
<div id="log"></div>
</div>

</main>

<script>
"use strict";

const ENTRANCE = "TGENTRANCE|1|TITAN-GYM-OFFLINE";
const KEY = "titan_gym_final_records_v1";
const SYNC_URL = "https://script.google.com/macros/s/AKfycbyBb-M9lwO1ExkLmPJq32GJlHhn5Lv5nuj57n04I2U6x3VR3MDphl8-QR14J18jM5z1/exec";

const $ = id => document.getElementById(id);

const el = {
  name: $("name"),
  customer: $("customer"),
  access: $("access"),
  amount: $("amount"),
  payment: $("payment"),
  staff: $("staff"),
  verified: $("verified"),
  scanMsg: $("scanMsg"),
  syncMsg: $("syncMsg"),
  reader: $("reader"),
  count: $("count"),
  log: $("log"),
  customerCard: $("customerCard"),
  summary: $("summary"),
  customerQR: $("customerQR"),
  scanBtn: $("scanBtn"),
  stopBtn: $("stopBtn"),
  simulateBtn: $("simulateBtn"),
  syncBtn: $("syncBtn"),
  saveBtn: $("saveBtn")
};

let records = [];
let scanner = null;
let running = false;

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  records = Array.isArray(saved) ? saved : [];
} catch(e) {
  records = [];
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function uid(prefix){
  return prefix+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
}

function persist(){
  localStorage.setItem(KEY, JSON.stringify(records));
}

function render(){
  el.count.textContent = records.length + " records";
  if(!records.length){
    el.log.innerHTML = '<p class="muted">No records yet.</p>';
    return;
  }
  el.log.innerHTML = records.map(r =>
    '<div class="logrow"><b>'+esc(r.name)+'</b> '+
    '<span class="badge">'+esc(r.status)+'</span><br>'+
    esc(r.customer)+' • '+esc(r.access)+' • ₱'+Number(r.amount||0).toFixed(2)+' • '+esc(r.payment)+
    '<br><small>'+new Date(r.ts).toLocaleString()+' • '+esc(r.tx)+' • '+esc(r.sync)+'</small></div>'
  ).join("");
}

function syncStatus(message){
  const pending = records.filter(x=>x.sync==="PENDING").length;
  const synced = records.filter(x=>x.sync==="SYNCED").length;
  el.syncMsg.textContent = message ||
    ("Sync: "+(navigator.onLine ? "ONLINE" : "OFFLINE")+" • Pending: "+pending+" • Synced: "+synced);
}

function handleEntrance(value){
  if(String(value || "").trim() !== ENTRANCE){
    alert("Invalid Titan Gym Entrance QR.");
    return;
  }
  stopScanner();
  el.verified.classList.remove("hidden");
  el.scanMsg.textContent = "Entrance QR verified.";
  el.name.focus();
}

async function startScanner(){
  if(!window.Html5Qrcode){
    alert("Scanner library is not loaded. Open the page online once, then try again.");
    return;
  }
  if(running) return;
  scanner = new Html5Qrcode("reader");
  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:250}},
      handleEntrance
    );
    running = true;
    el.scanMsg.textContent = "Camera active.";
  }catch(e){
    running = false;
    alert("Camera could not start. Allow camera permission.");
  }
}

async function stopScanner(){
  if(scanner && running){
    try{ await scanner.stop(); }catch(e){}
  }
  running = false;
  el.reader.innerHTML = "";
}

function makeCustomerQR(text){
  el.customerQR.innerHTML = "";
  if(typeof window.qrcode !== "function"){
    el.customerQR.innerHTML = "<p class='muted'>QR generator is not loaded.</p>";
    return;
  }
  const q = window.qrcode(0,"M");
  q.addData(text);
  q.make();
  el.customerQR.innerHTML = q.createImgTag(6,8);
}

function payload(r){
  const obj = {
    v:1, tx:r.tx, entry:r.entry, ts:r.ts, name:r.name,
    customer:r.customer, access:r.access, amount:r.amount,
    payment:r.payment, staff:r.staff
  };
  return "TG2|" + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
}

async function syncPending(){
  if(!SYNC_URL || SYNC_URL.startsWith("PASTE_")){
    syncStatus("Google Sheets URL not configured.");
    return;
  }
  if(!navigator.onLine){
    syncStatus("OFFLINE — pending records kept locally.");
    return;
  }

  const pending = records.filter(x=>x.sync==="PENDING");

  if(!pending.length){
    syncStatus();
    return;
  }

  el.syncMsg.textContent = "Syncing "+pending.length+" record(s)...";

  for(const r of pending){
    try{
      const response = await fetch(SYNC_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(r)
      });
      const text = await response.text();
      let data;
      try{ data = JSON.parse(text); }catch(e){ data = null; }

      if(data && data.ok){
        r.sync = "SYNCED";
      }
    }catch(e){
      // Keep PENDING so it retries later.
    }
  }

  persist();
  render();
  syncStatus();
}

function saveRegistration(){
  const n = el.name.value.trim();

  if(!n){
    alert("Enter Full Name.");
    el.name.focus();
    return;
  }

  const r = {
    type:"registration",
    tx:uid("TX"),
    entry:uid("EN"),
    ts:new Date().toISOString(),
    name:n,
    customer:el.customer.value,
    access:el.access.value,
    amount:Number(el.amount.value || 0),
    payment:el.payment.value,
    staff:el.staff.value.trim(),
    source:"ENTRANCE_QR_OR_MANUAL",
    status:"REGISTERED",
    sync:"PENDING"
  };

  records.unshift(r);
  persist();
  render();

  el.customerCard.classList.remove("hidden");
  el.summary.innerHTML =
    "<b>"+esc(r.name)+"</b><br>"+
    esc(r.customer)+" • "+esc(r.access)+" • ₱"+r.amount.toFixed(2)+" • "+esc(r.payment)+
    "<br><small>"+esc(r.tx)+"</small><br><span class='badge'>REGISTERED</span>";

  makeCustomerQR(payload(r));

  el.name.value = "";
  el.amount.value = "";
  el.staff.value = "";

  syncStatus();
  syncPending();
}

el.scanBtn.addEventListener("click", startScanner);
el.stopBtn.addEventListener("click", stopScanner);
el.simulateBtn.addEventListener("click", ()=>handleEntrance(ENTRANCE));
el.syncBtn.addEventListener("click", syncPending);
el.saveBtn.addEventListener("click", saveRegistration);

window.addEventListener("online", syncPending);
window.addEventListener("offline", ()=>syncStatus());

render();
syncStatus();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
