<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Titan Gym Entrance QR Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;text-align:center;padding:18px}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}button{border:0;border-radius:10px;padding:13px 16px;font-weight:700;margin:4px 2px}.primary{background:#111827;color:#fff}.green{background:#15803d;color:#fff}.blue{background:#2563eb;color:#fff}.gray{background:#e5e7eb}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px;font-size:16px}label{font-weight:700;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.muted{color:#6b7280;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}#reader{max-width:500px;margin:auto}.qrbox{text-align:center}.qrbox img{max-width:280px}.logrow{border-top:1px solid #eee;padding:12px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script></head><body><header><h1>🏋️ TITAN GYM</h1><div>Entrance QR Test • Offline Ready</div></header><main><div class="card"><h2>📷 Scan Entrance QR</h2><p class="muted">Scan the permanent Titan Gym Entrance QR using this app.</p><button class="blue" onclick="startScanner()">SCAN ENTRANCE QR</button><button class="gray" onclick="stopScanner()">STOP</button><div id="reader"></div><p id="status" class="muted"></p></div><div class="card"><h2>🧪 Test Without QR</h2><button class="primary" onclick="handleEntrance(ENTRANCE)">SIMULATE ENTRANCE SCAN</button></div><div class="card"><h2>🔳 Permanent Entrance QR</h2><p class="muted">TGENTRANCE|1|TITAN-GYM-OFFLINE</p><div id="entranceQR" class="qrbox"></div></div><div id="registration" class="card hidden"><h2>📝 Registration Form</h2><span class="badge">ENTRANCE QR VERIFIED</span><label>Full Name</label><input id="name" placeholder="Enter full name"><label>Student / Regular</label><select id="customer"><option>Student</option><option>Regular</option></select><label>Access Type</label><select id="access"><option>Daily Walk-in</option><option>Monthly</option><option>Personal Trainer</option></select><div class="grid"><div><label>Amount Paid</label><input id="amount" type="number" min="0" placeholder="0"></div><div><label>Payment</label><select id="payment"><option>Cash</option><option>GCash</option><option>Bank Transfer</option></select></div></div><label>Staff (optional)</label><input id="staff" placeholder="Staff name"><button class="green" onclick="saveRegistration()">SAVE REGISTRATION</button></div><div id="customerCard" class="card hidden"><h2>🔳 Customer QR</h2><div id="summary"></div><div id="customerQR" class="qrbox"></div></div><div class="card"><h2>📋 Access Log</h2><div id="count" class="badge">0 records</div><div id="log"></div></div></main><script>
const ENTRANCE='TGENTRANCE|1|TITAN-GYM-OFFLINE',KEY='titan_entrance_test_v1';let records=JSON.parse(localStorage.getItem(KEY)||'[]'),scanner=null,running=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function uid(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function handleEntrance(raw){if((raw||'').trim()!==ENTRANCE){alert('Invalid Entrance QR.');return}stopScanner();document.getElementById('status').textContent='Entrance QR verified. Registration Form opened.';document.getElementById('registration').classList.remove('hidden');document.getElementById('registration').scrollIntoView({behavior:'smooth'})}
async function startScanner(){if(typeof Html5Qrcode==='undefined'){alert('Scanner library is not cached yet. Open the app online once, reload, then try again.');return}if(running)return;scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},t=>handleEntrance(t));running=true;document.getElementById('status').textContent='Camera active. Point at the permanent Entrance QR.'}catch(e){alert('Camera could not start. Allow camera permission and try again.')}}async function stopScanner(){if(scanner&&running){try{await scanner.stop()}catch(e){}}running=false;document.getElementById('reader').innerHTML=''}
function makeQR(text,id){let b=document.getElementById(id);b.innerHTML='';if(typeof qrcode==='undefined'){b.textContent='QR generator not loaded yet.';return}let q=qrcode(0,'M');q.addData(text);q.make();b.innerHTML=q.createImgTag(6,8)}function payload(r){return 'TG2|'+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,tx:r.tx,entry:r.entry,ts:r.ts,name:r.name,customer:r.customer,access:r.access,amount:r.amount,payment:r.payment,staff:r.staff}))))}
function saveRegistration(){let name=document.getElementById('name').value.trim();if(!name){alert('Please enter Full Name.');return}let r={tx:uid('TX'),entry:uid('EN'),ts:new Date().toISOString(),name,customer:customer.value,access:access.value,amount:Number(amount.value||0),payment:payment.value,staff:staff.value.trim(),source:'ENTRANCE_QR',status:'REGISTERED',sync:'PENDING'};records.unshift(r);localStorage.setItem(KEY,JSON.stringify(records));customerCard.classList.remove('hidden');summary.innerHTML='<b>'+esc(r.name)+'</b><br>'+esc(r.customer)+' • '+esc(r.access)+' • ₱'+r.amount.toFixed(2)+' • '+esc(r.payment)+'<br><small>'+esc(r.tx)+'</small><br><span class="badge">REGISTERED</span>';makeQR(payload(r),'customerQR');render();customerCard.scrollIntoView({behavior:'smooth'});alert('Registration saved offline. Transaction: '+r.tx)}
function render(){count.textContent=records.length+' records';log.innerHTML=records.length?records.map(r=>'<div class="logrow"><b>'+esc(r.name)+'</b> <span class="badge">'+esc(r.status)+'</span><br>'+esc(r.customer)+' • '+esc(r.access)+' • ₱'+Number(r.amount).toFixed(2)+' • '+esc(r.payment)+'<br><small>'+new Date(r.ts).toLocaleString()+' • '+esc(r.entry)+' • '+esc(r.source)+' • Sync: '+esc(r.sync)+'</small></div>').join(''):'<p class="muted">No records yet.</p>'}makeQR(ENTRANCE,'entranceQR');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
