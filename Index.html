<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Titan Gym Offline</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}header{background:#111827;color:white;text-align:center;padding:18px}main{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;margin:4px 2px}.blue{background:#2563eb;color:white}.green{background:#15803d;color:white}.gray{background:#e5e7eb}.primary{background:#111827;color:white}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 12px;font-size:16px}label{font-weight:700;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.muted{color:#6b7280;font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}.qrbox{text-align:center}.qrbox img{max-width:280px}.logrow{border-top:1px solid #eee;padding:12px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script></head>
<body><header><h1>🏋️ TITAN GYM</h1><div>Offline Registration System</div></header><main>
<div class="card"><h2>📷 Scan Entrance QR</h2><p class="muted">Scan the permanent Entrance QR.</p><button class="blue" onclick="startScanner()">SCAN ENTRANCE QR</button><button class="gray" onclick="stopScanner()">STOP</button><div id="reader"></div><p id="scanMsg" class="muted"></p></div>
<div class="card"><button class="primary" onclick="handleEntrance(ENTRANCE)">🧪 SIMULATE ENTRANCE SCAN</button><button class="gray" onclick="syncPending()">SYNC PENDING NOW</button><p id="syncMsg" class="muted"></p></div>
<div class="card"><h2>📝 Registration Form</h2><span id="verified" class="badge hidden">ENTRANCE QR VERIFIED</span><label>Full Name</label><input id="name" placeholder="Enter full name"><label>Student / Regular</label><select id="customer"><option>Student</option><option>Regular</option></select><label>Access Type</label><select id="access"><option>Daily Walk-in</option><option>Monthly</option><option>Personal Trainer</option></select><div class="grid"><div><label>Amount Paid</label><input id="amount" type="number" min="0" placeholder="0"></div><div><label>Payment</label><select id="payment"><option>Cash</option><option>GCash</option><option>Bank Transfer</option></select></div></div><label>Staff</label><input id="staff" placeholder="Staff name"><button class="green" onclick="saveRegistration()">SAVE REGISTRATION</button></div>
<div id="customerCard" class="card hidden"><h2>🔳 Customer QR</h2><div id="summary"></div><div id="customerQR" class="qrbox"></div></div>
<div class="card"><h2>📋 Access Log</h2><span id="count" class="badge">0 records</span><div id="log"></div></div>
</main><script>
const ENTRANCE="TGENTRANCE|1|TITAN-GYM-OFFLINE",KEY="titan_gym_final_records_v1",SYNC_URL="https://script.google.com/macros/s/AKfycbyBb-M9lwO1ExkLmPJq32GJlHhn5Lv5nuj57n04I2U6x3VR3MDphl8-QR14J18jM5z1/exec";let records=JSON.parse(localStorage.getItem(KEY)||"[]"),scanner=null,running=false;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function uid(p){return p+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}function save(){localStorage.setItem(KEY,JSON.stringify(records));render();syncStatus()}
function handleEntrance(x){if((x||"").trim()===ENTRANCE){stopScanner();verified.classList.remove("hidden");scanMsg.textContent="Entrance QR verified.";name.focus()}else alert("Invalid Titan Gym Entrance QR.")}
async function startScanner(){if(!window.Html5Qrcode){alert("Open online once so the scanner can be cached.");return}if(running)return;scanner=new Html5Qrcode("reader");try{await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},handleEntrance);running=true;scanMsg.textContent="Camera active."}catch(e){alert("Camera could not start. Allow camera permission.")}}
async function stopScanner(){if(scanner&&running){try{await scanner.stop()}catch(e){}}running=false;reader.innerHTML=""}
function qr(text){customerQR.innerHTML="";if(!window.qrcode){customerQR.innerHTML="<p>QR generator not cached.</p>";return}let q=qrcode(0,"M");q.addData(text);q.make();customerQR.innerHTML=q.createImgTag(6,8)}
function payload(r){return "TG2|"+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,tx:r.tx,entry:r.entry,ts:r.ts,name:r.name,customer:r.customer,access:r.access,amount:r.amount,payment:r.payment,staff:r.staff}))))}
function saveRegistration(){let n=name.value.trim();if(!n){alert("Enter Full Name.");return}let r={type:"registration",tx:uid("TX"),entry:uid("EN"),ts:new Date().toISOString(),name:n,customer:customer.value,access:access.value,amount:Number(amount.value||0),payment:payment.value,staff:staff.value.trim(),source:"ENTRANCE_QR_OR_MANUAL",status:"REGISTERED",sync:"PENDING"};records.unshift(r);save();customerCard.classList.remove("hidden");summary.innerHTML="<b>"+esc(r.name)+"</b><br>"+esc(r.customer)+" • "+esc(r.access)+" • ₱"+r.amount.toFixed(2)+" • "+esc(r.payment)+"<br><small>"+r.tx+"</small><br><span class=badge>REGISTERED</span>";qr(payload(r));alert(navigator.onLine?"Saved. Syncing to Google Sheets.":"Saved OFFLINE. It will sync when internet returns.");syncPending();name.value="";amount.value="";staff.value=""}
async function syncPending(){if(!SYNC_URL||SYNC_URL.startsWith("PASTE_")){syncStatus("Google Sheets URL not configured.");return}if(!navigator.onLine){syncStatus("OFFLINE — pending records kept locally.");return}for(let r of records.filter(x=>x.sync==="PENDING")){try{let a=await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(r)}),d=await a.json();if(d.ok)r.sync="SYNCED"}catch(e){}}saveNoSync()}
function saveNoSync(){localStorage.setItem(KEY,JSON.stringify(records));render();syncStatus()}function syncStatus(msg){let p=records.filter(x=>x.sync==="PENDING").length,s=records.filter(x=>x.sync==="SYNCED").length;syncMsg.textContent=msg||("Sync: "+(navigator.onLine?"ONLINE":"OFFLINE")+" • Pending: "+p+" • Synced: "+s)}function render(){count.textContent=records.length+" records";log.innerHTML=records.length?records.map(r=>"<div class=logrow><b>"+esc(r.name)+"</b> <span class=badge>"+r.status+"</span><br>"+esc(r.customer)+" • "+esc(r.access)+" • ₱"+Number(r.amount).toFixed(2)+" • "+esc(r.payment)+"<br><small>"+new Date(r.ts).toLocaleString()+" • "+r.tx+" • "+r.sync+"</small></div>").join(""):"<p class=muted>No records yet.</p>"}window.addEventListener("online",syncPending);window.addEventListener("offline",syncStatus);render();syncStatus();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
